name: openchamber
base: core24
version: '2.0.3'
title: OpenChamber
summary: Web interface for OpenCode
license: MIT
description: |
  OpenChamber is a web interface for OpenCode. It runs a local server
  and serves a PWA UI, spawning the OpenCode agent engine and
  PTY-backed terminal sessions.

  Start agent work, see what changed, and take it through review and
  release. Your projects and sessions remain available when you switch
  devices or step away.

grade: stable
confinement: strict

contact: https://github.com/openchamber/openchamber
issues: https://github.com/openchamber/openchamber/issues
source-code: https://github.com/openchamber/openchamber
website: https://openchamber.dev

platforms:
  amd64:

apps:
  openchamber:
    command: bin/openchamber
    plugs:
      - network
      - network-bind
      - home
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      OPENCODE_SKIP_START: "true"

parts:
  node-runtime:
    plugin: nil
    stage-snaps:
      - node/22/stable

  openchamber:
    plugin: npm
    after:
      - node-runtime
    source: https://registry.npmjs.org/@openchamber/web/-/web-2.0.3.tgz
    source-type: tar
    build-snaps:
      - node/22/stable
    stage-snaps:
      - opencode/latest/stable
    build-packages:
      - python3
      - make
      - g++
    build-attributes:
      - enable-patchelf
