name: Build and Test Snap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snap
        id: build
        uses: canonical/action-build@v1.3.0

      - name: Smoke test
        run: ./tests/smoke-test.sh ${{ steps.build.outputs.snap }}

      - name: Upload snap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-snap
          path: ${{ steps.build.outputs.snap }}