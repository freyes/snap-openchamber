name: Publish Snap

on:
  workflow_run:
    workflows: ["Build and Test Snap"]
    types: [completed]
    branches: [main]

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download snap artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build-and-test.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: openchamber-snap

      - name: Find snap file
        id: snap
        run: echo "file=$(ls openchamber_*.snap)" >> "$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-snap
          path: ${{ steps.snap.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.workflow_run.head_sha }}
          name: build-${{ github.event.workflow_run.head_sha }}
          files: ${{ steps.snap.outputs.file }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snap to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.file }}
          release: edge